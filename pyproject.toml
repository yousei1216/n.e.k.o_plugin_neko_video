[project]
name = "neko_video"
version = "0.4.0"
description = "看视频猫娘"
requires-python = ">=3.11"
# 运行时不依赖任何第三方库（只用标准库：ctypes / urllib / zlib / xml），
# 因此无需 vendor/ —— 用户下载 .neko-plugin 即可用，不用装任何东西。
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib 模式：不让 pytest 把插件根目录当包导入（否则会 import 插件入口
# __init__.py，而它依赖只存在于宿主里的 plugin.sdk，本地测试必然失败）。
addopts = "--import-mode=importlib"
