[project]
name = "neko_video"
version = "0.4.0"
description = "看视频猫娘"
requires-python = ">=3.11"
# 运行时不依赖任何第三方库（只用标准库：ctypes / urllib / zlib / xml），
# 因此无需 vendor/ —— 用户下载 .neko-plugin 即可用，不用装任何东西。
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# ★ 必须用 importlib 模式：默认的 prepend 模式会让 pytest 沿目录向上找到
#   插件根目录的 `__init__.py`（它是插件入口，第 75 行 `from plugin.sdk.plugin
#   import ...`，而 plugin.sdk 只存在于 N.E.K.O 宿主进程里），于是 59 个测试
#   全部报 ModuleNotFoundError: No module named 'plugin'。
#   importlib 模式按文件路径导入、不碰包根，测试文件自己把插件根目录插进
#   sys.path（见 tests/test_offline.py 第 12 行）。
addopts = "--import-mode=importlib"
